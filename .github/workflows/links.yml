name: Weekly citation link check

on:
  schedule:
    - cron: "17 4 * * 3" # Wednesdays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx tsx scripts/check-links.ts
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/check-links
          title: "Weekly link check: broken citations and archive copies"
          commit-message: "chore: weekly citation link check"
          body: |
            Automated weekly run of `scripts/check-links.ts`: every cited URL probed (HEAD, then GET), redirects and domain moves recorded, Wayback Machine snapshots looked up and requested for broken links.
            This covers the urgent-advice sources of `src/data/red-flags.ts` as well as the corpus, and flags a soft 404 (a `.pdf` URL answering 200 with HTML) as gone.
            Review `public/links.json`; the broken-links section of /audit/ renders it. Replace dead URLs with the archive copy or a current source; log factual changes in CORRECTIONS.md.
            A dead red-flag source fails `src/lib/red-flags.test.ts`, so fix those first.
          labels: automated, trust
          delete-branch: true
      - name: Merge the refresh (this run already validated and tested it)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
