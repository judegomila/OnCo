name: Refresh literature snapshot from Europe PMC

on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The fetch and the gates are separate jobs because they were not: the fetch grew to about 89 minutes against a
# 90-minute job budget, so the gates were cancelled and no pull request was ever opened. The snapshot sat at
# 22 September for three weeks while the work was done and thrown away every Tuesday. The fetch now has its own
# budget and hands the snapshot on as an artefact, so a slow fetch can delay the gates but can no longer eat them.
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No --force: settled years are reused from the snapshot already in the tree, which takes a topic from
      # eleven requests to five. A stored zero is still refetched, so the recorded zeros heal as this runs.
      - run: npm run fetch:papers
      - uses: actions/upload-artifact@v4
        with:
          name: papers-snapshot
          path: public/papers/
          retention-days: 2

  refresh:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: papers-snapshot
          path: public/papers/
      # The merge below is unattended, so the tree the pull request carries must pass what a person's branch passes.
      # The gates never fail the job: when one does the pull request is still opened, the merge step is skipped and
      # the next step labels it for review, so a red snapshot waits for a person instead of landing on main.
      - id: gates
        uses: ./.github/actions/gates
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-papers
          title: "Weekly refresh: Europe PMC literature snapshot"
          commit-message: "chore: refresh literature snapshot from Europe PMC"
          body: |
            Automated weekly pull of paper counts per year and the five most recent titles for every product, target, cancer, and technology, from the Europe PMC REST API.
            Files under `public/papers/` changed. The /papers/ page recomputes fastest-growing topics from this snapshot.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge it (only when this run's gates passed)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
      - name: Leave it for review (a gate failed in this run)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color D93F0B --description "A person must check this before it lands" --force || true
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-review
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body "Not merged: ${{ steps.gates.outputs.failed }} failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The snapshot is on this branch for a person to read."
