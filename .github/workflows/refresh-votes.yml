name: Weekly idea votes

on:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  discussions: read

jobs:
  votes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-votes.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/votes
          title: "Weekly idea votes from Discussions"
          commit-message: "chore: refresh public/votes.json from Discussions reactions"
          body: |
            Automated weekly run of `npx tsx scripts/fetch-votes.ts`: reactions and comment counts on threads in the Objects discussion category, matched to entity ids, written to `public/votes.json` and rendered at /idea-votes/.
          labels: automated, community
          delete-branch: true
